config:
  edition: 2

bucket_definitions:
  by_resource:
    parameters: SELECT resource_id FROM user_access WHERE user_id = auth.user_id()
    data:
      - SELECT * FROM resource WHERE id = bucket.resource_id

streams:
  stream_a:
    query: |
      SELECT r.* FROM resource r
      WHERE r.id IN (SELECT resource_id FROM user_access WHERE user_id = auth.user_id())
    auto_subscribe: true

  stream_b:
    query: |
      SELECT r.* FROM resource r
      WHERE r.id IN (SELECT resource_id FROM user_access WHERE user_id = auth.user_id())
    auto_subscribe: true
